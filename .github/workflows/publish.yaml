name: Build & Push (GHCR) - ga_ihosthardwarecontrol

on:
  push:
    branches: [ master ]
    tags: ['*']                 # allow tag-triggered releases
    paths:
      - "**"
      - ".github/workflows/publish.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NS: ghcr.io/greenautarky
  ADDON_SLUG: ga_ihosthardwarecontrol        # underscore kept as requested
  ADDON_DIR: "" #uses root
  BASE_VERSION: 18.1.4          # single, no-`v` scheme for all arches

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Minimal change: read version from config.yaml (fallback to config.json)
      - name: Read add-on version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver=""
          if [[ -f config.yaml ]]; then
            # Extract the first "version: ..." (handles quotes & spaces)
            ver=$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^"#]+)"?.*$/\1/p' config.yaml | head -n1 | xargs || true)
          fi
          if [[ -z "${ver}" && -f config.json ]]; then
            # Fallback if someone still has the json around
            ver=$(jq -r '.version // empty' config.json || true)
          fi
          if [[ -z "${ver}" ]]; then
            echo "::error::Could not read version from config.yaml (or config.json as fallback)"
            exit 1
          fi
          echo "Detected add-on version: $ver"
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NS }}/${{ env.ADDON_SLUG }}-${{ matrix.ha_arch }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.value }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The base comes from build.yaml, not from a string assembled here.
      # Until 2026-08-20 this step built the name itself, so build.yaml did not
      # exist and the Dockerfile's own ARG default named a DIFFERENT base than
      # the one actually used — both obvious places to look were wrong and only
      # this step was true. Same class as ga-ops#37, MQTT and influxDBv1 the
      # same day; all four now call one resolver, which lives in the PUBLIC
      # vibe_addons repo so a called workflow can check it out with no
      # cross-repo token. It FAILS rather than falling back when build.yaml
      # omits an arch, and warns loudly when there is no build.yaml at all.
      - name: Checkout the store repo (public — carries the base resolver)
        uses: actions/checkout@v4
        with:
          repository: greenautarky/vibe_addons
          path: .store

      - name: Install PyYAML
        run: pip install --quiet "PyYAML>=6,<7"

      - name: Resolve base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          img=$(python3 .store/scripts/resolve_addon_base.py \
                  --addon-dir . \
                  --arch "${{ matrix.ha_arch }}" \
                  --legacy-tag "${{ env.BASE_VERSION }}")
          echo "img=$img" >> "$GITHUB_OUTPUT"
          echo "Using base: $img"

      - name: Build & Push (${{ matrix.ha_arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.ADDON_DIR }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.img }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            BUILD_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
